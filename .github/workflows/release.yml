name: Release

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.11.31"

jobs:
  build:
    name: Validate and build once
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Reject prereleases and empty release notes
        shell: bash
        env:
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          if [[ "${IS_PRERELEASE}" != "false" ]]; then
            echo "Stable release workflow does not publish prereleases." >&2
            exit 1
          fi
          if [[ -z "${RELEASE_BODY//[[:space:]]/}" ]]; then
            echo "GitHub Release notes must not be empty." >&2
            exit 1
          fi

      - name: Check out the existing release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch main ancestry
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: false

      - name: Install release environment
        run: uv sync --frozen --extra dev

      - name: Validate version, changelog, tag, and commit
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          uv run --frozen python scripts/check_release.py
          --tag "${RELEASE_TAG}"
          --require-annotated-tag
          --require-clean
          --require-tag-on-main

      - name: Read project version
        id: version
        shell: bash
        run: |
          version="$(uv run --frozen python scripts/check_release.py --print-version)"
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

      - name: Run release quality gate
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy
          uv run --frozen pyright
          uv run --frozen pytest

      - name: Build wheel and source distribution
        run: uv run --frozen python -m build --outdir dist

      - name: Validate distribution metadata
        run: uv run --frozen twine check --strict dist/*

      - name: Verify and isolated-install both distributions
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.value }}
        run: >-
          uv run --frozen python scripts/verify_distribution.py
          --dist-dir dist
          --expected-version "${EXPECTED_VERSION}"

      - name: Upload immutable release distributions
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions-${{ steps.version.outputs.value }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish-to-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/base-typed-string/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # Mint the short-lived PyPI Trusted Publishing OIDC token.
    steps:
      - name: Download the verified distributions by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist

      - name: Publish through PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: dist/
          verify-metadata: true
          skip-existing: false
          verbose: false
          print-hash: true
          attestations: true

  attach-github-assets:
    name: Attach the published artifacts
    needs:
      - build
      - publish-to-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Attach the already-published files to this GitHub Release.
    steps:
      - name: Download the verified distributions by artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: dist

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum ./* | sort --key=2 > ../SHA256SUMS

      - name: Attach the same distributions and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: >-
          gh release upload "${RELEASE_TAG}"
          dist/* SHA256SUMS
          --clobber
          --repo "${GITHUB_REPOSITORY}"

  verify-production:
    name: Verify production installation
    needs:
      - build
      - publish-to-pypi
      - attach-github-assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out smoke script from the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.14"
          enable-cache: false

      - name: Retry a clean install from production PyPI
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if uv run \
              --isolated \
              --no-project \
              --refresh-package base-typed-string \
              --with "base-typed-string[pydantic]==${RELEASE_VERSION}" \
              python scripts/smoke_installed.py \
                --expected-version "${RELEASE_VERSION}" \
                --with-pydantic; then
              exit 0
            fi
            if [[ "${attempt}" != "6" ]]; then
              sleep 10
            fi
          done
          exit 1
